# Keeps the live-score job (live.yml) running: every 15 minutes, if no run of it is in progress or queued, start one.
# The job normally starts its own successor; this covers a cancelled run, a runner lost, or a first start.
name: Watchdog

on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let busy = 0;
            for (const status of ['in_progress', 'queued', 'pending', 'waiting', 'requested']) {
              try {
                const r = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'live.yml', status, per_page: 1 });
                busy += r.data.total_count;
              } catch (e) { core.info(`${status}: ${e.status}`); busy += 1; }
            }
            if (busy) { core.info(`live.yml has ${busy} run(s) in progress or queued: nothing to do`); return; }
            try {
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'live.yml', ref: 'main' });
              core.info('live.yml was not running: started');
            } catch (e) { core.info(`could not start live.yml (${e.status}); the next check tries again`); }
