# Temporary: which form of a Pages deployment does GitHub accept from a loop? (deleted after the test)
name: Probe

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --silent @actions/artifact@2
      - uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('child_process');
            const fs = require('fs');
            const { DefaultArtifactClient } = require('@actions/artifact');
            const artifact = new DefaultArtifactClient();
            const { owner, repo } = context.repo;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            fs.mkdirSync('site', { recursive: true });
            fs.copyFileSync('index.html', 'site/index.html');
            async function attempt(label, name, version, tarArgs, wait) {
              fs.writeFileSync('site/live.json', JSON.stringify({ v: 1, at: Math.floor(Date.now() / 1000), sports: {}, probe: label }));
              execFileSync('tar', tarArgs.concat(['-cf', 'artifact.tar', '-C', 'site', '.']));
              try { await artifact.deleteArtifact(name); } catch (e) { /* none yet */ }
              const up = await artifact.uploadArtifact(name, ['artifact.tar'], '.', { retentionDays: 1 });
              if (wait) await sleep(wait);
              try {
                const oidc = await core.getIDToken();
                const dep = (await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                  owner, repo, artifact_id: Number(up.id), pages_build_version: version, oidc_token: oidc })).data;
                let status = '';
                const t0 = Date.now();
                while (Date.now() - t0 < 90000) {
                  await sleep(2500);
                  status = (await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { owner, repo, id: dep.id })).data.status || '';
                  if (status === 'succeed' || /failed|cancelled|lost|error/.test(status)) break;
                }
                core.info(`RESULT ${label}: created ${dep.id}, status ${status} after ${Math.round((Date.now() - t0) / 1000)}s (artifact ${up.id}, ${up.size} bytes)`);
                return status === 'succeed';
              } catch (e) {
                core.info(`RESULT ${label}: ${e.status} ${e.message} ${e.response && e.response.data ? JSON.stringify(e.response.data).slice(0, 300) : ''} (artifact ${up.id})`);
                return false;
              }
            }
            const uniq = (k) => `live-${context.runId}-${k}`;
            await attempt('A numbered name, unique version', 'github-pages-1', uniq('a'), [], 0);
            await attempt('B numbered name, sha version', 'github-pages-2', context.sha, [], 0);
            await attempt('C github-pages name, sha version', 'github-pages', context.sha, [], 0);
            await attempt('D github-pages name, unique version', 'github-pages', uniq('d'), [], 0);
            await attempt('E github-pages name again, unique version (a second deploy in one run)', 'github-pages', uniq('e'), [], 0);
            await attempt('F numbered name, unique version, 20 s wait after upload', 'github-pages-6', uniq('f'), [], 20000);
            await attempt('G github-pages name, the same sha version again', 'github-pages', context.sha, [], 0);
